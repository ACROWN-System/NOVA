name: AstroCrown Image Qualification — Manual Cloudflare

on:
  workflow_dispatch:
    inputs:
      no_payment_confirmed:
        description: "Confirm the Cloudflare account remains on its current no-payment configuration. Choose no if unsure."
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
        required: true
      prompt:
        description: "Default is a quiet 16:9 financial-UI background. Non-sensitive prompt only."
        type: string
        default: "Minimal deep-space background plate for a financial website UI. Nearly uniform near-black deep navy across the frame. Only a few tiny, faint, low-luminosity stars. One small, soft, diffuse, desaturated blue-violet space cloud confined to a small area near an outer edge. Keep most of the frame dark, visually quiet and uninterrupted, with no focal point. Very low contrast, restrained saturation, subtle texture only. Background only; it must sit behind numbers, charts and controls without distracting or reducing text readability. No predominant elements."
        required: true
      negative_prompt:
        description: "Optional non-sensitive description of elements to avoid in the generated image."
        type: string
        default: "large nebula, dominant cloud, wide cloud, bright or numerous stars, dense starfield, starbursts, lens flares, light streaks, glowing hotspots, saturated purple, magenta, hot pink, vivid blue, bright center, high contrast, high luminosity, planets, moons, galaxies, spacecraft, objects, text, letters, logos, charts, UI, borders, clutter"
        required: false
      width:
        description: "Image width in pixels (256–2048); 512 gives a small preview."
        type: number
        default: 512
        required: true
      height:
        description: "Image height in pixels (256–2048); 288 keeps a 16:9 frame at low resolution."
        type: number
        default: 288
        required: true
      steps:
        description: "Generation steps (1–20); retain four for this SDXL-Lightning test."
        type: number
        default: 4
        required: true
      seed:
        description: "Fixed non-negative seed for more controlled repeat tests; cross-version identity is not guaranteed."
        type: number
        default: 20261015
        required: true

permissions:
  contents: read

concurrency:
  group: astrocrown-image-qualification
  cancel-in-progress: false

jobs:
  qualify-cloudflare-image:
    if: github.ref == 'refs/heads/main' && inputs.no_payment_confirmed == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fetch reviewed public AstroCrown image adapter revision without a repository token
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet astro-crown-web
          git -C astro-crown-web remote add origin https://github.com/ACROWN-System/AstroCrown-Web.git
          git -C astro-crown-web fetch --quiet --no-tags --depth=1 origin cdde2a8a3a008da91b88111b3fa6fac1b5ae4937
          git -C astro-crown-web checkout --quiet --detach FETCH_HEAD
          test "$(git -C astro-crown-web rev-parse HEAD)" = "cdde2a8a3a008da91b88111b3fa6fac1b5ae4937"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify required NOVA secrets are configured
        env:
          CLOUDFLARE_API_KEY_01: ${{ secrets.CLOUDFLARE_API_KEY_01 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_KEY_01}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Configure CLOUDFLARE_API_KEY_01 and CLOUDFLARE_ACCOUNT_ID as NOVA repository Actions secrets. Do not paste secret values into logs or prompts."
            exit 2
          fi
          echo "Required NOVA secret names are present; secret values were not printed."

      - name: Generate and validate one image
        env:
          ASTROCROWN_CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY_01 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEDIA_PROMPT: ${{ inputs.prompt }}
          IMAGE_NEGATIVE_PROMPT: ${{ inputs.negative_prompt }}
          IMAGE_WIDTH: ${{ inputs.width }}
          IMAGE_HEIGHT: ${{ inputs.height }}
          IMAGE_STEPS: ${{ inputs.steps }}
          IMAGE_SEED: ${{ inputs.seed }}
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          started_ms="$(date +%s%3N)"
          python astro-crown-web/development/ai-media-generator/cloudflare_image.py \
            --prompt-env MEDIA_PROMPT \
            --output "$RUNNER_TEMP/astrocrown-first-image.png" \
            --width "$IMAGE_WIDTH" \
            --height "$IMAGE_HEIGHT" \
            --steps "$IMAGE_STEPS" \
            --negative-prompt "$IMAGE_NEGATIVE_PROMPT" \
            --seed "$IMAGE_SEED"
          finished_ms="$(date +%s%3N)"
          elapsed_ms="$((finished_ms - started_ms))"
          printf 'CLIENT_TOTAL_ELAPSED_MS=%s\n' "$elapsed_ms"
          printf 'MEASUREMENT_NOTE=Client wall-clock duration includes request, validation, and local artifact writing; it is not provider-only latency.\n'

      - name: Upload image and provenance for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: astrocrown-cloudflare-image-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/astrocrown-first-image.png
            ${{ runner.temp }}/astrocrown-first-image.png.metadata.json
            ${{ runner.temp }}/astrocrown-first-image.jpg
            ${{ runner.temp }}/astrocrown-first-image.jpg.metadata.json
          if-no-files-found: error
          retention-days: 7
