name: NOVA Validation

on:
  workflow_dispatch:

concurrency:
  group: nova-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Compile NOVA Python
        run: python -m compileall -q NOVA

      - name: Run NOVA unit tests
        run: python -m unittest discover -s NOVA/tests -p "test_*.py" -v
