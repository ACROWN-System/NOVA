name: NOVA Cloudflare API Smoke Test

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: nova-cloudflare-smoke-test
  cancel-in-progress: false

jobs:
  cloudflare-smoke-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    env:
      CLOUDFLARE_API_TOKEN_02: ${{ secrets.CLOUDFLARE_API_TOKEN_02 }}
      CLOUDFLARE_ACCOUNT_ID_02: ${{ vars.CLOUDFLARE_ACCOUNT_ID_02 }}
    steps:
      - name: Verify documented Workers AI chat-completions request
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get("CLOUDFLARE_API_TOKEN_02", "").strip()
          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID_02", "").strip()
          if not token or not account_id:
              print("CONFIGURATION=FAIL_MISSING_SECRET")
              print(f"TOKEN_PRESENT={bool(token)}")
              print(f"ACCOUNT_ID_PRESENT={bool(account_id)}")
              sys.exit(1)

          def post(url, payload=None):
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "NOVA-Cloudflare-Smoke-Test/1.0",
              }
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(url, data=data, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.read()

          # Cloudflare's documented token verification endpoint.
          try:
              status, raw = post("https://api.cloudflare.com/client/v4/accounts/" + account_id + "/tokens/verify")
              verification = json.loads(raw.decode("utf-8"))
          except (urllib.error.URLError, TimeoutError, OSError, ValueError):
              print("TOKEN_VERIFY=FAIL")
              sys.exit(1)
          print(f"TOKEN_VERIFY_HTTP_STATUS={status}")
          if not (200 <= status < 300 and verification.get("success") is True
                  and str(verification.get("result", {}).get("status", "")).lower() == "active"):
              print("TOKEN_VERIFY=FAIL")
              sys.exit(1)
          print("TOKEN_VERIFY=PASS")

          # Direct Workers AI REST endpoint; avoids AI Gateway routing and its gateway header.
          payload = {
              "prompt": 'Return exactly this JSON object with no additional keys or markdown: {"nova_health":"OK","ack":"NOVA_HEALTH_PROBE"}',
              "temperature": 0,
              "max_tokens": 64,
          }
          url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + account_id + "/ai/run/@cf/meta/llama-3.1-8b-instruct-fast"
          )
          try:
              status, raw = post(url, payload)
          except (urllib.error.URLError, TimeoutError, OSError) as error:
              print("WORKERS_AI_INFERENCE=NETWORK_ERROR")
              print(f"ERROR_TYPE={type(error).__name__}")
              sys.exit(1)

          print(f"WORKERS_AI_HTTP_STATUS={status}")
          if not 200 <= status < 300:
              print("WORKERS_AI_INFERENCE=HTTP_ERROR")
              try:
                  error_payload = json.loads(raw.decode("utf-8"))
                  errors = error_payload.get("errors", [])
                  if isinstance(errors, list):
                      for item in errors[:5]:
                          if isinstance(item, dict):
                              code = item.get("code")
                              message = item.get("message")
                              if code is not None:
                                  print(f"CLOUDFLARE_ERROR_CODE={str(code)[:40]}")
                              if isinstance(message, str):
                                  safe_message = " ".join(message.split())[:240]
                                  print(f"CLOUDFLARE_ERROR_MESSAGE={safe_message}")
              except (ValueError, UnicodeDecodeError, AttributeError, TypeError):
                  print("CLOUDFLARE_ERROR_DETAILS=UNAVAILABLE_OR_NON_JSON")
              sys.exit(1)

          try:
              response = json.loads(raw.decode("utf-8"))
              result = response.get("result", {})
              content = result.get("response") if isinstance(result, dict) else None
          except (ValueError, UnicodeDecodeError, AttributeError, TypeError):
              print("WORKERS_AI_INFERENCE=FAIL")
              print("RESPONSE_CONTRACT=INVALID_WORKERS_AI_RESPONSE")
              sys.exit(1)

          print(f"MESSAGE_CONTENT_PRESENT={isinstance(content, str) and bool(content.strip())}")
          if not isinstance(content, str) or not content.strip():
              print("WORKERS_AI_INFERENCE=FAIL")
              print("RESPONSE_CONTRACT=NO_TEXT_CONTENT")
              sys.exit(1)

          try:
              health = json.loads(content)
          except ValueError:
              print("WORKERS_AI_INFERENCE=FAIL")
              print("RESPONSE_CONTRACT=CONTENT_NOT_JSON")
              sys.exit(1)

          if not isinstance(health, dict) or health.get("nova_health") != "OK" or health.get("ack") != "NOVA_HEALTH_PROBE":
              print("WORKERS_AI_INFERENCE=FAIL")
              print("RESPONSE_CONTRACT=HEALTH_MARKER_MISMATCH")
              sys.exit(1)

          print("WORKERS_AI_INFERENCE=PASS")
          print("RESPONSE_CONTRACT=PASS")
          print("MODEL=@cf/meta/llama-3.1-8b-instruct-fast")
          PY
