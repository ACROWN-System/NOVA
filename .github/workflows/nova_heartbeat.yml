name: NOVA Autonomous Heartbeat

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  metacognitive_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute NOVA Router
        env:
          GROQ_API_KEY_01: ${{ secrets.GROQ_API_KEY_01 }}
          GEMINI_API_KEY_01: ${{ secrets.GEMINI_API_KEY_01 }}
        run: python NOVA/router.py

      - name: Commit Graph Memory Updates
        run: |
          git config --global user.name "NOVA Autonomous Engine"
          git config --global user.email "nova@haan.system"
          git add NOVA/README.md
          git commit -m "feat(NOVA): Autonomous memory state update" || echo "No changes to commit"
          git push
